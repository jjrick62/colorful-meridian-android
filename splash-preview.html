<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash Preview — Colorful Meridian</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Particle System ---
const particles = [];
const PARTICLE_COUNT = 120;

class Particle {
  constructor() {
    this.reset();
    // Random starting life so they don't all appear at once
    this.life = Math.random();
  }

  reset() {
    // Position: bias toward top half (y: 0~H*0.5)
    this.x = Math.random() * W;
    this.y = Math.random() * H * 0.45;
    this.size = Math.random() * 2.2 + 0.8;  // 0.8~3px
    this.speedY = -(Math.random() * 0.4 + 0.1); // drift upward slowly
    this.speedX = (Math.random() - 0.5) * 0.3;
    this.life = 0;
    this.maxLife = 0.8 + Math.random() * 1.5; // flicker duration in seconds
    this.opacity = 0;
    this.targetOpacity = 0.2 + Math.random() * 0.8;
    // Color: white with occasional warm tint
    const rand = Math.random();
    if (rand < 0.15) this.hue = 30;   // warm gold
    else if (rand < 0.25) this.hue = 200; // cool blue
    else if (rand < 0.30) this.hue = 340; // soft pink
    else this.hue = 0; // pure white
    this.saturation = this.hue === 0 ? 0 : 20;
    this.lightness = 80 + Math.random() * 20;
  }

  update(dt) {
    this.life += dt;
    if (this.life > this.maxLife) { this.reset(); this.life = 0; }

    // Opacity: fade in → hold → fade out
    const fadeIn = 0.3;
    const fadeOut = 0.3;
    if (this.life < fadeIn) {
      this.opacity = (this.life / fadeIn) * this.targetOpacity;
    } else if (this.life > this.maxLife - fadeOut) {
      this.opacity = ((this.maxLife - this.life) / fadeOut) * this.targetOpacity;
    } else {
      this.opacity = this.targetOpacity;
    }

    this.x += this.speedX;
    this.y += this.speedY;
    if (this.y < -5) this.reset();
  }

  draw(ctx) {
    if (this.opacity <= 0.01) return;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${this.opacity})`;
    ctx.fill();

    // Glow halo for brighter particles
    if (this.opacity > 0.5) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${this.opacity * 0.15})`;
      ctx.fill();
    }
  }
}

// Init
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push(new Particle());
}

// --- Text Animation ---
// "COLORFUL · MERIDIAN" — gradually brightens
let textAlpha = 0;
const textAlphaTarget = 1;
const textAlphaSpeed = 0.35; // fade in per second

// --- Shooting stars (occasional) ---
const shootingStars = [];
let shootingCooldown = 0;

// --- Main Loop ---
let lastTime = performance.now();

function drawText(alpha) {
  const baseSize = Math.min(W * 0.065, H * 0.055, 36);
  const letterSpacing = baseSize * 0.28;

  // "COLORFUL" + "MERIDIAN" on two lines with a diamond between
  const line1 = 'Colorful';
  const line2 = 'Meridian';
  const separator = '·';
  const totalText = line1 + separator + line2;

  // Calculate total width for centering
  ctx.font = `300 ${baseSize}px 'Georgia', 'Times New Roman', serif`;
  const line1W = ctx.measureText(line1).width;
  const separatorW = ctx.measureText(separator).width;
  const line2W = ctx.measureText(line2).width;
  const gap = baseSize * 0.3;

  // Vertical center
  const centerY = H * 0.52;

  // Draw line by line
  const line1X = W / 2 - line1W / 2;
  const sepX = W / 2 - separatorW / 2;
  const line2X = W / 2 - line2W / 2;
  const line1Y = centerY - baseSize * 0.65;
  const line2Y = centerY + baseSize * 0.65;

  // Glow effect
  ctx.shadowColor = `rgba(255,255,255,${alpha * 0.6})`;
  ctx.shadowBlur = alpha * 30;

  // "Colorful"
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  ctx.font = `300 ${baseSize}px 'Georgia', 'Times New Roman', serif`;
  ctx.textAlign = 'left';
  ctx.fillText(line1, line1X, line1Y);

  // Separator diamond — colored
  ctx.fillStyle = `rgba(180,200,255,${alpha * 1.0})`;
  ctx.font = `300 ${baseSize * 0.9}px 'Georgia', 'Times New Roman', serif`;
  ctx.fillText(separator, sepX - separatorW * 0.15, centerY);

  // "Meridian"
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  ctx.font = `300 ${baseSize}px 'Georgia', 'Times New Roman', serif`;
  ctx.fillText(line2, line2X, line2Y);

  // Subtitle
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  const subSize = baseSize * 0.32;
  ctx.font = `${subSize}px 'Georgia', 'Times New Roman', serif`;
  ctx.fillStyle = `rgba(150,160,180,${alpha * 0.7})`;
  ctx.textAlign = 'center';
  ctx.fillText('YOUR WORLD · YOUR COLORS', W / 2, centerY + baseSize * 1.3);
}

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);

  // Particles at top
  for (const p of particles) {
    p.update(dt);
    p.draw(ctx);
  }

  // Shooting stars
  if (shootingCooldown <= 0 && Math.random() < 0.02) {
    shootingStars.push({
      x: Math.random() * W * 0.7,
      y: Math.random() * H * 0.3,
      len: 60 + Math.random() * 120,
      angle: -30 + Math.random() * 20,
      life: 0,
      maxLife: 0.4 + Math.random() * 0.6,
    });
    shootingCooldown = 1.5 + Math.random() * 3;
  }
  shootingCooldown -= dt;

  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.life += dt;
    if (s.life > s.maxLife) { shootingStars.splice(i, 1); continue; }
    const progress = s.life / s.maxLife;
    const alpha = progress < 0.3 ? progress / 0.3 : 1 - (progress - 0.3) / 0.7;
    const rad = s.angle * Math.PI / 180;
    const ex = s.x + Math.cos(rad) * s.len;
    const ey = s.y + Math.sin(rad) * s.len;
    const grad = ctx.createLinearGradient(s.x, s.y, ex, ey);
    grad.addColorStop(0, `rgba(255,255,255,${alpha * 0.9})`);
    grad.addColorStop(1, `rgba(255,255,255,0)`);
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  // Text fade in
  textAlpha = Math.min(textAlphaTarget, textAlpha + textAlphaSpeed * dt);
  drawText(textAlpha);

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
