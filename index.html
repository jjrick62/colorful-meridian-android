<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self'; font-src 'self';">
  <title>Colorful · Meridian</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ===== Splash Loader ===== -->
  <div id="splash-loader">
    <canvas id="splash-canvas"></canvas>
    <span id="splash-hint">触摸任意位置开始&hellip;</span>
  </div>
  <style>
    #splash-loader { position:fixed; inset:0; z-index:9999; background:#000; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    #splash-loader canvas { display:block; position:absolute; inset:0; }
    #splash-hint { position:absolute; bottom:12vh; color:rgba(255,255,255,0); font-size:16px; font-family:'Georgia','Times New Roman',serif; letter-spacing:2px; z-index:1; transition:color 1.2s ease; pointer-events:none; }
    #splash-loader.ready #splash-hint { color:rgba(255,255,255,0.6); animation: hint-pulse 2s ease-in-out infinite; }
    @keyframes hint-pulse { 0%,100% { color:rgba(255,255,255,0.4); } 50% { color:rgba(255,255,255,0.85); } }
    #splash-loader.fade-out { opacity:0; transition:opacity 0.6s ease-out; pointer-events:none; }
  </style>
  <script>
  (function(){
    var c=document.getElementById('splash-canvas');
    var ctx=c.getContext('2d');
    var W,H;
    function R(){ W=c.width=window.innerWidth; H=c.height=window.innerHeight; }
    R(); window.addEventListener('resize',R);
    var ps=[],PC=Math.min(120,Math.floor(W*H/30000));
    function P(){
      this.reset=function(){
        this.x=Math.random()*W; this.y=Math.random()*H*0.45;
        this.sz=Math.random()*2.2+0.8; this.sy=-(Math.random()*0.4+0.1);
        this.sx=(Math.random()-0.5)*0.3; this.lf=0;
        this.ml=0.8+Math.random()*1.5; this.op=0;
        this.to=0.2+Math.random()*0.8;
        var r=Math.random();
        if(r<0.15) this.hu=30; else if(r<0.25) this.hu=200; else if(r<0.30) this.hu=340; else this.hu=0;
        this.sa=this.hu===0?0:20; this.li=80+Math.random()*20;
      }; this.reset(); this.lf=Math.random();
    }
    P.prototype.update=function(dt){
      this.lf+=dt; if(this.lf>this.ml){this.reset();this.lf=0;}
      var fi=0.3,fo=0.3;
      if(this.lf<fi) this.op=(this.lf/fi)*this.to;
      else if(this.lf>this.ml-fo) this.op=((this.ml-this.lf)/fo)*this.to;
      else this.op=this.to;
      this.x+=this.sx;this.y+=this.sy;if(this.y<-5)this.reset();
    };
    P.prototype.draw=function(ctx){
      if(this.op<=0.01)return;
      ctx.beginPath();ctx.arc(this.x,this.y,this.sz,0,Math.PI*2);
      ctx.fillStyle='hsla('+this.hu+','+this.sa+'%,'+this.li+'%,'+this.op+')';ctx.fill();
      if(this.op>0.5){ctx.beginPath();ctx.arc(this.x,this.y,this.sz*2.5,0,Math.PI*2);ctx.fillStyle='hsla('+this.hu+','+this.sa+'%,'+this.li+'%,'+(this.op*0.15)+')';ctx.fill();}
    };
    for(var i=0;i<PC;i++)ps.push(new P());
    var ss=[],scd=0,tA=0,fI=0,lt=performance.now();
    function L(n){
      var dt=Math.min((n-lt)/1000,0.1);lt=n;tA=Math.min(1,tA+1.25*dt);fI=Math.min(1,fI+1.25*dt);
      ctx.clearRect(0,0,W,H);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=fI; for(var i=0;i<ps.length;i++){ps[i].update(dt);ps[i].draw(ctx);}
      if(scd<=0&&Math.random()<0.02){ss.push({x:Math.random()*W*0.7,y:Math.random()*H*0.3,len:60+Math.random()*120,ang:-30+Math.random()*20,lf:0,ml:0.4+Math.random()*0.6});scd=1.5+Math.random()*3;}
      scd-=dt;
      for(var i=ss.length-1;i>=0;i--){var s=ss[i];s.lf+=dt;if(s.lf>s.ml){ss.splice(i,1);continue;}var p=s.lf/s.ml,a=p<0.3?p/0.3:1-(p-0.3)/0.7,ra=s.ang*Math.PI/180,ex=s.x+Math.cos(ra)*s.len,ey=s.y+Math.sin(ra)*s.len,gr=ctx.createLinearGradient(s.x,s.y,ex,ey);gr.addColorStop(0,'rgba(255,255,255,'+(a*0.9*fI)+')');gr.addColorStop(1,'rgba(255,255,255,0)');ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(ex,ey);ctx.strokeStyle=gr;ctx.lineWidth=1.2;ctx.stroke();}
      ctx.globalAlpha=1;
      var bs=Math.min(W*0.065,H*0.055,36),cy=H*0.52;
      ctx.shadowColor='rgba(255,255,255,'+(tA*0.6)+')';ctx.shadowBlur=tA*30;
      ctx.fillStyle='rgba(255,255,255,'+tA+')';ctx.font='300 '+bs+'px Georgia,"Times New Roman",serif';ctx.textAlign='center';ctx.fillText('Colorful',W/2,cy-bs*0.65);
      ctx.fillStyle='rgba(180,200,255,'+tA+')';ctx.font='300 '+(bs*0.9)+'px Georgia,"Times New Roman",serif';ctx.fillText('·',W/2,cy);
      ctx.fillStyle='rgba(255,255,255,'+tA+')';ctx.font='300 '+bs+'px Georgia,"Times New Roman",serif';ctx.fillText('Meridian',W/2,cy+bs*0.65);
      ctx.shadowBlur=0;ctx.shadowColor='transparent';
      ctx.fillStyle='rgba(150,160,180,'+(tA*0.7)+')';ctx.font=(bs*0.32)+'px Georgia,"Times New Roman",serif';ctx.fillText('YOUR WORLD · YOUR COLORS',W/2,cy+bs*1.3);
      requestAnimationFrame(L);
    }
    requestAnimationFrame(L);
  })();
  </script>
  <!-- ===== Splash Loader End ===== -->

  <!-- Three.js 背景 -->
  <div id="globe-container"></div>

  <!-- 顶部栏 -->
  <header id="header">
    <div class="header-left">
      <h1>Colorful · Meridian</h1>
      <span id="stats" class="stats"></span>
    </div>
    <div class="header-right">
      <button id="btn-pause" class="btn-pause" title="暂停/播放">
        <span class="pause-icon"></span>
      </button>
      <button id="btn-add" class="btn-add">+</button>
      <button id="btn-settings" class="btn-triangle">&#9660;</button>
      <button id="btn-account" class="btn-account" title="账号">👤</button>
      <div id="settings-dropdown" class="dropdown hidden">
        <div class="dropdown-section">
          <div class="dropdown-label">常住地</div>
          <div class="search-select">
            <input type="text" id="home-search" placeholder="搜索中国城市..." autocomplete="off" aria-label="搜索常住地">
            <div id="home-search-results" class="search-results"></div>
          </div>
          <div id="home-display" class="home-display hidden">
            当前：<span id="home-name"></span>
          </div>
        </div>
        <div class="dropdown-divider"></div>
        <button id="btn-export" class="dropdown-btn">导出数据</button>
        <button id="btn-import" class="dropdown-btn">导入数据</button>
        <input type="file" id="import-file" accept=".json" hidden>
        <button id="btn-overview" class="dropdown-btn">地点总览</button>
        <button id="btn-reset-view" class="dropdown-btn">重置视角</button>
      </div>
    </div>
  </header>

  <!-- 添加地点浮层 -->
  <div id="add-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>添加地点</h2>
        <button class="btn-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="city-search">地点</label>
          <div class="search-select">
            <input type="text" id="city-search" placeholder="搜索城市/地区（支持中英文）..." autocomplete="off">
            <div id="city-search-results" class="search-results"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="input-lat">纬度 Lat</label>
            <input type="number" id="input-lat" step="any" placeholder="31.2304">
          </div>
          <div class="form-group">
            <label for="input-lng">经度 Lng</label>
            <input type="number" id="input-lng" step="any" placeholder="121.4737">
          </div>
        </div>
        <div class="form-group">
          <label for="visit-date">访问日期</label>
          <input type="date" id="visit-date">
        </div>
        <div class="form-group">
          <label>评分</label>
          <div class="star-input" id="star-input">
            <span data-value="1">☆</span>
            <span data-value="2">☆</span>
            <span data-value="3">☆</span>
            <span data-value="4">☆</span>
            <span data-value="5">☆</span>
          </div>
        </div>
        <div class="form-group">
          <label for="place-notes">感想</label>
          <textarea id="place-notes" rows="3" placeholder="写点感想..."></textarea>
        </div>
        <div class="form-group">
          <label>照片</label>
          <div class="modal-photo-grid" id="modal-photo-grid"></div>
          <button id="btn-modal-add-photo" class="btn-text">+ 添加照片</button>
          <input type="file" id="modal-photo-input" accept="image/*" multiple hidden>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-outline" id="btn-delete-modal" style="margin-right:auto">删除</button>
        <button class="btn-secondary" id="btn-cancel-add">取消</button>
        <button class="btn-primary" id="btn-save-add">保存</button>
      </div>
    </div>
  </div>

  <!-- 地点详情卡片 -->
  <div id="detail-card" class="detail-card hidden">
    <div class="detail-header">
      <h2 id="detail-name"></h2>
      <button id="btn-close-detail" class="btn-close">&times;</button>
    </div>
    <div class="detail-body">
      <div class="detail-meta">
        <span id="detail-fullname" class="detail-fullname"></span>
        <span id="detail-date" class="detail-date"></span>
      </div>
      <div class="detail-stars" id="detail-stars"></div>
      <div class="detail-photos">
        <div class="photo-grid" id="photo-grid"></div>
        <button id="btn-add-photo" class="btn-text">+ 添加照片</button>
        <input type="file" id="photo-input" accept="image/*" multiple hidden>
      </div>
      <div class="detail-notes" id="detail-notes"></div>
    </div>
    <div class="detail-footer">
      <button id="btn-edit-place" class="btn-secondary">编辑</button>
      <button id="btn-delete-place" class="btn-outline">删除</button>
    </div>
  </div>

  <!-- 地点总览 -->
  <div id="overview-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="overview-content">
      <div class="overview-header">
        <h2>地点总览</h2>
        <span id="overview-stats" class="overview-stats"></span>
        <button class="btn-close">&times;</button>
      </div>
      <div class="overview-body" id="overview-list"></div>
    </div>
  </div>

  <!-- 照片预览浮层 -->
  <div id="photo-viewer" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="photo-viewer-content">
      <button class="btn-close btn-close-light">&times;</button>
      <button id="photo-prev" class="photo-nav-btn photo-prev">&lsaquo;</button>
      <button id="photo-next" class="photo-nav-btn photo-next">&rsaquo;</button>
      <span id="photo-index" class="photo-index"></span>
      <img id="photo-viewer-img" src="" alt="照片">
      <div class="photo-caption-wrap">
        <input type="text" id="photo-caption" placeholder="添加说明文字..." autocomplete="off">
      </div>
    </div>
  </div>

  <!-- 3D 地点悬浮卡片覆盖层 -->
  <svg id="connector-lines"></svg>
  <div id="place-cards"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three.module.js",
      "three/addons/": "./js/vendor/"
    }
  }
  </script>

  <script type="module" src="js/earth.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
